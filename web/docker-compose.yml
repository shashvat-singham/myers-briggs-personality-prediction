# Local container run.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up --build        ->  http://localhost:3000
#
# The NEXT_PUBLIC_* values are build args, not runtime env: `next build` inlines
# them into the client bundle. Changing one in .env therefore needs a rebuild
# (`docker compose up --build`), not just a restart.

services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${NEXT_PUBLIC_FIREBASE_DATABASE_URL}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    image: mbti-premium:local
    ports:
      - "3000:3000"
    environment:
      # Server-side only. Absent is fine — the assistant reports that it is
      # unconfigured and the Auto control falls back to the local simulator.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
